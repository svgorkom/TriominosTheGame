name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  # Nothing goes live unless the solution builds and every test passes; CI runs the same on the push, but a separate workflow cannot hold this one back.
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: dotnet test Triominos.slnx -c Release

  deploy:
    name: Publish & deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Publish
        run: dotnet publish src/Triominos.Web/Triominos.Web.csproj -c Release -o publish

      # Cloudflare compresses the files itself when it serves them; the pre-compressed copies would only be uploaded as extra files.
      - name: Remove pre-compressed files
        run: find publish/wwwroot \( -name '*.br' -o -name '*.gz' \) -delete

      - name: Install the server
        run: npm ci --no-audit --no-fund
        working-directory: server

      - name: Test the server
        run: |
          npm run typecheck
          npm test
        working-directory: server

      # The Worker serves publish/wwwroot (see server/wrangler.jsonc) and runs the rooms of online games.
      - name: Deploy
        run: npx wrangler deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
