name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  # Every pull request, also stacked ones that target another feature branch.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore
        run: dotnet restore Triominos.slnx

      - name: Build
        run: dotnet build Triominos.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Triominos.slnx -c Release --no-build --verbosity normal

      - name: Publish web
        run: dotnet publish src/Triominos.Web/Triominos.Web.csproj -c Release -o publish

      # Measurement only (see docs/plans/BlazorUi.md, phase 7): the same publish with trimming off shows what trimming saves.
      - name: Publish web without trimming
        run: dotnet publish src/Triominos.Web/Triominos.Web.csproj -c Release -p:PublishTrimmed=false -o publish-untrimmed

      - name: Report published size
        run: node tools/size/measure.mjs publish/wwwroot publish-untrimmed/wwwroot

      - name: Check published scene
        run: |
          test -f publish/wwwroot/js/scene/scene.js
          test -f publish/wwwroot/index.html
          ls -la publish/wwwroot/js/scene publish/wwwroot/_framework | head -20
          du -sh publish/wwwroot

      - name: Smoke test in headless Chrome
        run: |
          (cd tools/smoke && npm ci --no-audit --no-fund)
          python3 -m http.server 8080 --directory publish/wwwroot > /dev/null 2>&1 &
          sleep 2
          status=0
          node tools/smoke/smoke.mjs http://localhost:8080/ smoke.jpg || status=$?
          echo "SCREENSHOT-BASE64-BEGIN"
          base64 -w 0 smoke.jpg
          echo
          echo "SCREENSHOT-BASE64-END"
          exit $status
